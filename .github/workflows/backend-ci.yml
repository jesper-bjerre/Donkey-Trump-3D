name: Backend CI
on:
  pull_request:
    paths: ['src/backend/**', 'src/backend.tests/**', 'src/scripts/backend-release*', 'infra/**', 'global.json', '.github/workflows/backend-*.yml']
  push:
    branches: [main]
    paths: ['src/backend/**', 'src/backend.tests/**', 'src/scripts/backend-release*', 'infra/**', 'global.json', '.github/workflows/backend-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports: ['10000:10000']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Release pipeline checks
        run: python3 src/scripts/backend-release-tests.py -v
      - name: Build and test API with real Azurite
        env:
          HighscoresTests__UseAzurite: 'true'
        run: dotnet test src/backend.tests -c Release
