name: Backend Deploy DEV
on:
  push:
    branches: [main]
    paths: ['src/backend/**', 'src/backend.tests/**', 'src/scripts/backend-release*', 'infra/**', 'global.json', '.github/workflows/backend-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-deploy-development
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        ports: ['10000:10000']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Release pipeline checks
        run: python3 src/scripts/backend-release-tests.py -v
      - name: Build and test API with real Azurite
        env:
          HighscoresTests__UseAzurite: 'true'
        run: dotnet test src/backend.tests -c Release
      - name: Publish immutable release package
        run: |
          dotnet publish src/backend -c Release --no-restore -o "$RUNNER_TEMP/publish"
          python3 src/scripts/backend-release.py package "$RUNNER_TEMP/publish" "$RUNNER_TEMP/release" "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: ${{ steps.target.outputs.origin }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-release
          path: ${{ runner.temp }}/release
      - name: Verify tested package
        run: python3 src/scripts/backend-release.py verify "$RUNNER_TEMP/release" "$GITHUB_SHA"
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to existing DEV app
        id: target
        run: |
          APP=$(python3 -c 'import json; print(json.load(open("infra/backend-environments.json"))["environments"]["development"]["appName"])')
          GROUP=$(python3 -c 'import json; print(json.load(open("infra/backend-environments.json"))["appResourceGroup"])')
          az webapp deploy --resource-group "$GROUP" --name "$APP" --src-path "$RUNNER_TEMP/release/app.zip" --type zip --clean true --restart true --only-show-errors --output none
          HOST=$(az webapp show --resource-group "$GROUP" --name "$APP" --query defaultHostName -o tsv)
          echo "origin=https://$HOST" >> "$GITHUB_OUTPUT"
      - name: Verify HTTPS and managed identity storage access
        env:
          ORIGIN: ${{ steps.target.outputs.origin }}
        run: python3 src/scripts/backend-release.py smoke "$ORIGIN"
